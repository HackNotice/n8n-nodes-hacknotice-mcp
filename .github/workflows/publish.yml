# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade:
#
#   npm install --save-dev @n8n/node-cli@latest
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   Requires npm CLI ≥ 11.5.1 and Node ≥ 22.14 (this workflow uses Node 24).
#   See https://docs.npmjs.com/trusted-publishers
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow filename: publish.yml  (exact name, case-sensitive)
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. package.json "repository.url" must match this GitHub repo exactly.
#   5. Leave NPM_TOKEN unset — npm publish uses OIDC from id-token: write.
#
# Option B — npm Automation Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# Both options work with --provenance. Provenance is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" or "v*.*.*" (e.g. 1.1.1 or v1.1.1).
# release-it in this repo uses tagName "v${version}" (see package.json).
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.
#
# To re-run a failed publish without a new commit (after fixing NPM_TOKEN /
# trusted publisher settings): Actions → Publish → Run workflow → pick the
# same tag branch in the ref selector, then run.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc. Also v1.1.0 (release-it default tagName).
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Require version tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*.*.*|refs/tags/*.*.*) ;;
            *)
              echo "::error::Select a version tag when running Publish manually (e.g. v1.0.2), not the default branch."
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs npm ≥ 11.5.1 (Node 24 ships a compatible npm).
          node-version: '24'
          # npm recommends not caching install artifacts for release/publish jobs.
          # Required so npm can authenticate via OIDC (trusted publisher) or NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with provenance (NPM_CONFIG_PROVENANCE + id-token: write; works with token or OIDC).
        # Option A — Trusted publisher: do not set NPM_TOKEN; npm uses OIDC in GitHub-hosted runners.
        # Option B — Token: add repo secret NPM_TOKEN (granular publish token for this package).
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance must not be forced in package.json: local `npm publish` has no OIDC provider (EUSAGE).
          # On GitHub-hosted runners with id-token: write, this enables attestations for CI releases.
          NPM_CONFIG_PROVENANCE: 'true'
